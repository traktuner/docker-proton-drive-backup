name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the revision count

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version-revision tag
        id: cliv
        run: |
          V=$(grep -oP '^ARG PROTON_CLI_VERSION=\K.*' Dockerfile)
          # Debian-style revision: commits since the current CLI version was set.
          BUMP=$(git log -1 --format=%H -S"PROTON_CLI_VERSION=$V" -- Dockerfile || true)
          if [ -n "$BUMP" ]; then REV=$(( $(git rev-list --count "$BUMP"..HEAD) + 1 )); else REV=1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$V-$REV" >> "$GITHUB_OUTPUT"
          echo "Image version: $V-$REV"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            # <cliVersion>-<revision> image tag so Renovate sees new releases even
            # on default-branch builds (git-tag pushes from CI don't trigger).
            type=raw,value=${{ steps.cliv.outputs.tag }},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            IMAGE_TAG=${{ steps.cliv.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
