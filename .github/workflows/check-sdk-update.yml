name: Check Proton Drive SDK update

# Replaces the CLI-era "Check Proton Drive CLI Update". Daily: if npm has a newer
# @protontech/drive-sdk than the pin in package.json, run the documented update
# command (npm run sdk:update -- <version>), run the same gates CI runs — SDK
# consistency, both typechecks, the unit/regression suite, the production build,
# the image build and the upgrade acceptance test — and open a PR with the result.
# A failing gate still opens the PR (as draft) so the breakage is visible and
# explained, but nothing is released without a human merging it.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version to move to (default: latest on npm)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Detect
        id: detect
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').dependencies['@protontech/drive-sdk']")
          TARGET="${{ inputs.version }}"
          [ -n "$TARGET" ] || TARGET=$(npm view @protontech/drive-sdk version)
          echo "current=$CURRENT target=$TARGET"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          BRANCH="deps/proton-sdk-$TARGET"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "$CURRENT" ] || git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pin, lockfile, vendored account module and metadata
        if: steps.detect.outputs.update == 'true'
        run: |
          npm ci
          npm run sdk:update -- "${{ steps.detect.outputs.target }}"
          git --no-pager diff --stat

      - name: Gates
        id: gates
        if: steps.detect.outputs.update == 'true'
        run: |
          set +e
          sudo apt-get install -y sqlite3 jq >/dev/null
          status() { if "$@" >"/tmp/$1.log" 2>&1; then echo "| \`$*\` | ✅ |"; else echo "| \`$*\` | ❌ |"; echo "failed=true" >> "$GITHUB_OUTPUT"; fi; }
          {
            echo "| Gate | Result |"
            echo "|---|---|"
            status npm run sdk:check
            status npm run typecheck
            status npm test
            status npm run build
            status docker build -t proton-drive-backup:sdk-update .
            status env NEW_IMAGE=proton-drive-backup:sdk-update test/upgrade/upgrade.sh
          } > /tmp/gates.md
          cat /tmp/gates.md

      - name: Open PR
        if: steps.detect.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ steps.detect.outputs.current }}
          TO: ${{ steps.detect.outputs.target }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json src/server/proton/vendor
          git commit -m "Update Proton Drive SDK to $TO"
          git push origin "$BRANCH"
          {
            echo "Updates \`@protontech/drive-sdk\` $FROM → $TO with \`npm run sdk:update -- $TO\`."
            echo
            echo "Upstream: https://github.com/ProtonDriveApps/sdk/blob/js/v$TO/client/js/CHANGELOG.md"
            echo
            cat /tmp/gates.md
            echo
            echo "Release after merge: bump \`version\` in package.json (the image tag is derived from it)."
          } > /tmp/body.md
          DRAFT=""
          [ "${{ steps.gates.outputs.failed }}" = "true" ] && DRAFT="--draft"
          gh pr create $DRAFT --base main --head "$BRANCH" --title "Update Proton Drive SDK to $TO" --body-file /tmp/body.md
