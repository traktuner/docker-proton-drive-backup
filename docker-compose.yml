# Proton Drive Backup — docker-compose reference.
# Copy, adjust the volume host paths, and `docker compose up -d`.
# Then open http://<host>:3000 and sign in once (the session persists in /data).

services:
  proton-drive:
    container_name: proton-drive-backup

    # `latest` follows releases. To pin, use `:1` (all 1.x), `:1.0` (fixes only)
    # or an exact version such as `:1.0.0` (docs/RELEASING.md).
    image: ghcr.io/traktuner/docker-proton-drive-backup:latest
    # Or build locally instead of pulling:
    # build: .

    ports:
      # host:container — change the host port (left) freely; keep container 3000.
      - "3000:3000"

    # ---------------------------------------------------------------------------
    # VOLUMES
    # ---------------------------------------------------------------------------
    volumes:
      # (1) /data — REQUIRED, READ-WRITE. Holds the Proton session
      #     (proton/auth-session.json) and the SQLite job database. Must be writable
      #     and persistent: without it you'd lose your login and all backup sets on
      #     every restart. A bind mount (shown) or a named volume both work.
      #     Upgrading from a CLI-era release (0.x tags) keeps this SAME /data: jobs,
      #     history, catalog and the session carry over. See README → "Upgrade".
      #     Security note: the session token is stored here in plaintext (0600) —
      #     encrypt this volume at the storage layer (encrypted ZFS dataset / LUKS).
      #     See README → "Session at rest".
      - ./data:/data

      # (2) /sources — the folders you want to BACK UP. They appear in the left
      #     "Local files" pane. The default below mounts ONE local folder
      #     READ-ONLY (:ro): the tool only ever READS sources, so :ro guarantees
      #     it can never modify or delete your data. (:rw is not needed for the
      #     simple one-source case — there is no restore-to-source feature;
      #     restore via Proton Drive web. For MULTIPLE sources see the layouts
      #     further down, where (a) intentionally mounts the parent :rw.)
      - ./sources:/sources:ro
      #
      #     MULTIPLE SOURCES: DO NOT simply add mounts at /sources/<sub> while the
      #     `./sources:/sources:ro` line above stays active. runc creates each
      #     nested mount's mountpoint INSIDE its parent mount; if that subdirectory
      #     doesn't already exist on the host, a read-only parent makes container
      #     start fail with:
      #       "error mounting ... to rootfs at "/sources/x":
      #        make mountpoint "/sources/x": ... read-only file system"
      #     (That is issue #72.) A third workaround exists — pre-creating the
      #     empty subdirectories on the host and keeping :ro — but it silently
      #     breaks again when you add the next share, so prefer one of the two
      #     layouts below:
      #
      #     (a) Keep the parent, but mount it READ-WRITE. Only the NESTED mounts
      #         hold your real data, and they stay :ro. Trade-offs vs. (b): the
      #         parent directory itself is writable from inside the container,
      #         and runc leaves the created mountpoint subdirectories behind in
      #         the host parent:
      #       - ./sources:/sources:rw
      #       - /mnt/nas/movies:/sources/movies:ro
      #       - /mnt/nas/photos:/sources/photos:ro
      #
      #     (b) Drop the parent mount entirely. Each share mounts directly under
      #         /sources; nothing else is writable or visible at all:
      #       - /mnt/nas/movies:/sources/movies:ro
      #       - /mnt/nas/photos:/sources/photos:ro
      #       - /mnt/nas/documents:/sources/documents:ro
      #
      #     In both layouts the shares show up as top-level folders in the left
      #     pane, and backup-set source paths are relative to /sources
      #     (e.g. "/movies/..."). Both are exercised by the deployment smoke
      #     matrix (test/deployment/smoke.sh).

      # (3) /config — OPTIONAL, declarative job deploy (Ansible/GitOps). Drop a
      #     "backup-sets.yaml" (or .yml / .json) here and the container auto-imports
      #     those backup sets on startup (idempotent, upsert by name). You only log
      #     in interactively once; the jobs are already there. Export the format
      #     from the UI (Backup sets → Export). READ-ONLY is fine.
      # - ./config:/config:ro

    # ---------------------------------------------------------------------------
    # ENVIRONMENT (all optional — sensible defaults are baked in)
    # ---------------------------------------------------------------------------
    environment:
      # Timezone for the scheduler (scheduled run times use it). Default: UTC.
      - TZ=Europe/Vienna

      # --- The rest rarely need changing; defaults shown ---

      # Folder shown in the left "Local files" pane. Keep "/sources" unless you
      # change the mount target above.
      # - LOCAL_ROOT=/sources

      # Where the declarative job config is read from (volume 3).
      # - CONFIG_DIR=/config

      # SQLite job database path — keep it under /data so it persists.
      # - DB_PATH=/data/backup.db

      # Proton session dir — keep it under /data so your login persists.
      # - PROTON_DRIVE_CACHE_DIR=/data/proton

      # Variables of CLI-era releases (PROTON_DRIVE_CREDENTIALS_STORE,
      # PROTON_DRIVE_LOG_LEVEL, BUN_JSC_forceRAMSize, PROTON_DRIVE_CLI) are no longer
      # needed. Leaving them in an existing compose file is harmless.

      # Proton API host — do not change.
      # - PROTON_DRIVE_BASE_URL=drive-api.proton.me

      # Repo used for the in-app "container update available?" check. Override if
      # you run a fork.
      # - GITHUB_REPO=traktuner/docker-proton-drive-backup

    restart: unless-stopped

    # ---------------------------------------------------------------------------
    # HARDENING (safe defaults — the app needs no extra Linux capabilities)
    # ---------------------------------------------------------------------------
    # Every option below is validated by the deployment smoke matrix
    # (test/deployment/smoke.sh) on each release, so an advertised mode can't ship
    # broken. See README → "Hardening".
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # "Limit upload speed" (Settings) works with cap_drop: ALL — the app throttles
    # its own uploads. CLI-era releases needed `cap_add: [NET_ADMIN]` for it; you
    # can remove that line (keeping it is harmless).

    # Optional, stronger: read-only root filesystem. The ONLY writable path the app
    # needs is the /data volume above (DB, Proton session); everything else
    # is served read-only. Add the two tmpfs mounts for the Next.js cache and /tmp,
    # and uncomment together. /config (declarative import) may be omitted entirely
    # or mounted :ro — it is never written.
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /app/.next/cache

    # Optional: run as a non-root user instead of root. Two ways:
    #
    # (a) `user:` — you run the container AS that UID. The image supports any UID, but
    #     the HOST directory bound to /data must already be writable by it
    #     (e.g. `sudo chown -R 1000:1000 ./data`). /sources stays read-only. HOME
    #     lives on /data, so this composes with read_only: true above.
    # user: "1000:1000"
    #
    # (b) PUID/PGID — the container starts as root, chowns /data for you, then drops
    #     to that user itself (handy when you can't chown the bind mount yourself).
    #     Do NOT combine with `user:` or read_only (it needs to start privileged).
    # environment:
    #   - PUID=1000
    #   - PGID=1000
    #
    # The app has NO built-in authentication (see README → Security). If the host
    # is not fully trusted, bind the published port to localhost and put an
    # authenticating reverse proxy in front, e.g.:
    #   ports:
    #     - "127.0.0.1:3005:3000"

# Alternative: use a named volume for /data instead of a bind mount.
# volumes:
#   proton-drive-data:
