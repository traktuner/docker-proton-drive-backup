name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch: # preview build of any branch: tags <branch> and <sha>

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

# Tag scheme (docs/RELEASING.md):
#   git tag vX.Y.Z  -> images X.Y.Z, X.Y, X, latest (+ X.Y.Z-1 so 0.x update checks
#                      notice it) and a GitHub Release from docs/releases/vX.Y.Z.md
#   vX.Y.Z-rc.N     -> image X.Y.Z-rc.N only, GitHub pre-release
#   push to main    -> main, <sha>          (never latest)
#   manual dispatch -> <branch>, <sha>      (previews)
jobs:
  # A release tag must match package.json and come with its release notes —
  # checked before anything is built or pushed.
  guard:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.k.outputs.kind }}
      image_tag: ${{ steps.k.outputs.image_tag }}
      version: ${{ steps.k.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Classify the build and compute the image tag
        id: k
        run: |
          V=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short=7 HEAD)
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
            if [ "${TAG#v}" != "$V" ]; then
              echo "::error::tag $TAG does not match package.json version $V"; exit 1
            fi
            if [ ! -s "docs/releases/$TAG.md" ]; then
              echo "::error::docs/releases/$TAG.md (release notes) is missing"; exit 1
            fi
            if [[ "$TAG" == *-* ]]; then KIND=prerelease; else KIND=release; fi
            IMAGE_TAG="$V"
          elif [ "$REF" = "refs/heads/main" ]; then
            KIND=edge; IMAGE_TAG="$V-edge.$SHA"
          else
            KIND=preview; IMAGE_TAG="$V-preview.$SHA"
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$KIND build, image tag $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

  # Build each arch on its OWN native runner (amd64 on ubuntu-latest, arm64 on the
  # free public-repo ubuntu-24.04-arm runner) and push it BY DIGEST (no tag). No
  # QEMU emulation, so the Next.js build runs at full speed on both. The `merge`
  # job below stitches the two digests into one multi-arch manifest under the tags.
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: SDK pin
        id: cliv
        run: |
          echo "sdk=$(node -p "require('./src/server/proton/vendor/UPSTREAM.json').sdkVersion")" >> "$GITHUB_OUTPUT"
          echo "sdkcommit=$(node -p "require('./src/server/proton/vendor/UPSTREAM.json').commit")" >> "$GITHUB_OUTPUT"

      # Push by digest only (no tag). On PRs push=false, so this just validates that
      # the image builds natively on both arches. gha cache is scoped per-arch so the
      # two concurrent legs don't clobber each other's cache.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            IMAGE_TAG=${{ needs.guard.outputs.image_tag }}
            APP_RELEASE=${{ needs.guard.outputs.version }}
            SDK_VERSION=${{ steps.cliv.outputs.sdk }}
            SDK_COMMIT=${{ steps.cliv.outputs.sdkcommit }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into a single multi-arch manifest and apply the
  # real tags here (the only place tags are set). Skipped on PRs (nothing pushed).
  merge:
    runs-on: ubuntu-latest
    needs: [guard, build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            # releases and release candidates (git tag vX.Y.Z / vX.Y.Z-rc.N)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.guard.outputs.kind == 'release' }}
            type=semver,pattern={{major}},enable=${{ needs.guard.outputs.kind == 'release' && !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ needs.guard.outputs.kind == 'release' }}
            # 0.x containers only understand "<version>-<revision>" in their update check
            type=raw,value=${{ needs.guard.outputs.version }}-1,enable=${{ needs.guard.outputs.kind == 'release' }}
            # main ("main") and previews ("<branch>"), plus "<sha>" for every pushed build
            type=ref,event=branch
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$(jq -r '.tags[0] | split(":")[1]' <<< "$DOCKER_METADATA_OUTPUT_JSON") || true

  # The GitHub Release (user-facing notes), only after the image is published.
  release:
    runs-on: ubuntu-latest
    needs: [guard, merge]
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'prerelease'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          KIND: ${{ needs.guard.outputs.kind }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
          elif [ "$KIND" = prerelease ]; then
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file "docs/releases/$TAG.md"
          fi
