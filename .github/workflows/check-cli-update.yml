name: Check Proton Drive CLI Update

# Detects the newest proton-drive CLI on Proton's download server, verifies the
# binaries (download + execution + sha512), pins the new version and checksums
# in the Dockerfile, then pushes the commit and a version tag — which triggers
# build-and-push to build the version-tagged container image.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  BASE_URL: https://proton.me/download/drive/cli
  REGISTRY: ghcr.io

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect newest available version
        id: detect
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '^ARG PROTON_CLI_VERSION=\K.*' Dockerfile)
          echo "Current version: $CURRENT"

          exists() { # both arches must return 200
            local v="$1" a code
            for a in linux-x64 linux-arm64; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/$v/$a/proton-drive")
              [ "$code" = "200" ] || return 1
            done
            return 0
          }

          IFS='.' read -r MA MI PA <<< "$CURRENT"
          best="$CURRENT"

          # Higher patch on the current minor
          p=$PA
          while p=$((p+1)); [ $p -le $((PA+50)) ]; do
            v="$MA.$MI.$p"; if exists "$v"; then best="$v"; else break; fi
          done

          # Higher minors (and their highest patch)
          mi=$MI
          while mi=$((mi+1)); [ $mi -le $((MI+20)) ]; do
            if exists "$MA.$mi.0"; then
              best="$MA.$mi.0"; p=0
              while p=$((p+1)); [ $p -le 50 ]; do
                v="$MA.$mi.$p"; if exists "$v"; then best="$v"; else break; fi
              done
            else break; fi
          done

          # Next major .0.0 (and its highest minor/patch)
          nma=$((MA+1))
          if exists "$nma.0.0"; then
            best="$nma.0.0"; mi=0
            while mi=$((mi+1)); [ $mi -le 20 ]; do
              if exists "$nma.$mi.0"; then
                best="$nma.$mi.0"; p=0
                while p=$((p+1)); [ $p -le 50 ]; do
                  v="$nma.$mi.$p"; if exists "$v"; then best="$v"; else break; fi
                done
              else break; fi
            done
          fi

          echo "Newest available: $best"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$best" >> "$GITHUB_OUTPUT"
          if [ "$best" != "$CURRENT" ]; then echo "update=true" >> "$GITHUB_OUTPUT"; else echo "update=false" >> "$GITHUB_OUTPUT"; fi

      - name: Verify binaries and compute checksums
        id: verify
        if: steps.detect.outputs.update == 'true'
        env:
          V: ${{ steps.detect.outputs.latest }}
          PROTON_DRIVE_UNSAFE_SECRETS: '1'
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/$V/linux-x64/proton-drive"   -o pd-x64
          curl -fsSL "$BASE_URL/$V/linux-arm64/proton-drive" -o pd-arm64

          # Execute the native (x64) binary as a sanity check.
          chmod +x pd-x64
          OUT=$(./pd-x64 version 2>&1 || ./pd-x64 --version 2>&1 || true)
          echo "version output: $OUT"
          echo "$OUT" | grep -qF "$V" || { echo "::error::x64 binary did not report version $V"; exit 1; }

          X64=$(sha512sum pd-x64   | cut -d' ' -f1)
          ARM64=$(sha512sum pd-arm64 | cut -d' ' -f1)
          echo "x64=$X64" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"

      - name: Bump Dockerfile, commit and tag
        id: bump
        if: steps.detect.outputs.update == 'true'
        env:
          V: ${{ steps.detect.outputs.latest }}
          X64: ${{ steps.verify.outputs.x64 }}
          ARM64: ${{ steps.verify.outputs.arm64 }}
        run: |
          set -euo pipefail
          sed -i -E "s/^ARG PROTON_CLI_VERSION=.*/ARG PROTON_CLI_VERSION=$V/" Dockerfile
          sed -i -E "s/^ARG PROTON_CLI_SHA512_X64=.*/ARG PROTON_CLI_SHA512_X64=$X64/" Dockerfile
          sed -i -E "s/^ARG PROTON_CLI_SHA512_ARM64=.*/ARG PROTON_CLI_SHA512_ARM64=$ARM64/" Dockerfile

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: update proton-drive CLI to $V"
          git tag "v$V"
          # Record the bump on main + a version tag. (Pushes made with
          # GITHUB_TOKEN do NOT trigger other workflows, so we build below.)
          git push --atomic origin HEAD:main "refs/tags/v$V"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.detect.outputs.update == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.detect.outputs.update == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image for the new version
        if: steps.detect.outputs.update == 'true'
        uses: docker/build-push-action@v7
        env:
          V: ${{ steps.detect.outputs.latest }}
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.bump.outputs.sha }}
            IMAGE_TAG=${{ steps.detect.outputs.latest }}-1
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:main
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.detect.outputs.latest }}-1
          cache-from: type=gha
          cache-to: type=gha,mode=max
